<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    :root {
      --cream: #FFFFCC;
      --pink: #ff6f9d;
      --red: #ff315d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--cream);
    }

    body {
      font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
      background:
        radial-gradient(ellipse at 50% 52%, rgba(100, 8, 38, .26), transparent 43%),
        radial-gradient(ellipse at 50% 100%, rgba(95, 8, 32, .18), transparent 38%),
        #080609;
    }

    #scene {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .topline {
      position: fixed;
      top: 28px;
      left: clamp(20px, 4vw, 56px);
      z-index: 2;
      color: #f4a4bc;
      letter-spacing: .24em;
      font-size: 13px;
      line-height: 1.9;
      pointer-events: none;
    }

    .topline strong {
      display: block;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: .32em;
    }

    .bottom-left {
      position: fixed;
      left: clamp(20px, 4vw, 56px);
      bottom: 26px;
      z-index: 2;
      color: #e99ab2;
      font: 11px/1.8 Georgia, serif;
      letter-spacing: .18em;
      pointer-events: none;
    }

    .bottom-left:after {
      content: "";
      display: block;
      width: 36px;
      height: 1px;
      background: #d66c8c;
      margin-top: 10px;
    }

    .hint {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(255, 218, 228, .72);
      font-size: 12px;
      letter-spacing: .12em;
      white-space: nowrap;
      pointer-events: none;
    }

    .enter {
      position: fixed;
      right: clamp(20px, 4vw, 56px);
      bottom: 30px;
      z-index: 3;
      border: 0;
      background: transparent;
      color: #f7a2bd;
      font: 12px/1.8 "Songti SC", serif;
      letter-spacing: .12em;
      cursor: pointer;
      padding: 10px;
    }

    .enter .heart-icon {
      display: block;
      font: 26px/1.2 Georgia, serif;
      margin-bottom: 3px;
    }

    .enter:hover {
      color: #fff0f4;
      text-shadow: 0 0 16px #ff5b8a;
    }

    #letter {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vh 8vw;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s;
      background: rgba(5, 3, 7, .12);
      backdrop-filter: blur(0px);
    }

    #letter.show {
      opacity: 1;
      visibility: visible;
      backdrop-filter: blur(3px);
    }

    .letter-paper {
      width: min(820px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: clamp(24px, 5vw, 56px);
      background: rgba(8, 5, 9, .35);
      border: 1px solid rgba(255, 255, 204, .14);
      box-shadow: 0 0 80px rgba(255, 50, 100, .08);
      scrollbar-color: rgba(255, 255, 204, .3) transparent;
    }

    .letter-title {
      color: var(--cream);
      font-size: clamp(20px, 3vw, 28px);
      font-weight: normal;
      letter-spacing: .16em;
      margin: 0 0 28px;
    }

    #letterText {
      color: var(--cream);
      font-size: clamp(16px, 1.65vw, 20px);
      line-height: 2.15;
      white-space: pre-wrap;
      letter-spacing: .035em;
      overflow-wrap: anywhere;
    }

    .letter-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      color: rgba(255, 255, 204, .65);
      font-size: 12px;
    }

    .letter-actions button {
      color: var(--cream);
      background: transparent;
      border: 1px solid rgba(255, 255, 204, .3);
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }

    .letter-actions button:hover {
      background: rgba(255, 255, 204, .08);
    }

    #back {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 7;
      border: 1px solid rgba(255, 255, 204, .25);
      color: var(--cream);
      background: rgba(8, 5, 9, .35);
      padding: 9px 13px;
      font: 12px "Songti SC", serif;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
    }

    #back.show {
      opacity: 1;
      visibility: visible;
    }

    #veil {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: #080609;
      opacity: 0;
      transition: opacity .8s ease;
    }

    #veil.on {
      opacity: .3;
    }

    .note {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 204, .55);
      font-size: 11px;
      letter-spacing: .18em;
      z-index: 2;
      pointer-events: none;
    }

    @media (max-width:600px) {
      .topline {
        top: 18px;
      }

      .hint {
        bottom: 88px;
        font-size: 10px;
        letter-spacing: .04em;
      }

      .bottom-left {
        bottom: 18px;
      }

      .enter {
        bottom: 17px;
      }

      #letter {
        padding: 5vh 5vw;
      }

      .letter-paper {
        max-height: 90vh;
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <div id="scene" aria-label="500天情书"></div>
  <button class="enter" id="enter"><span class="heart-icon">♡</span>点击这里<br>进入信件</button>
  <div id="veil"></div>
  <section id="letter" aria-label="情书">
    <div class="letter-paper">
      <div id="letterText"></div>
      <div class="letter-actions">
        <span id="typingStatus">LoveUUUUUU~</span>
        <div><button id="skip">显示全文</button> <button id="closeLetter">回到爱心</button></div>
      </div>
    </div>
  </section>
  <button id="back">← 回到爱心</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      const container = document.getElementById('scene');
      const enter = document.getElementById('enter');
      const letter = document.getElementById('letter');
      const letterText = document.getElementById('letterText');
      const typingStatus = document.getElementById('typingStatus');
      const skip = document.getElementById('skip');
      const closeLetter = document.getElementById('closeLetter');
      const back = document.getElementById('back');
      const veil = document.getElementById('veil');

      // 你的完整情书：展开信件时逐字呈现，保留原文与段落。
      const sourceText = `我们都很喜欢夏天，那时候，我们刚刚认识不久，仿佛生活中每一件寻常的小事，都值得拿出来和你分享；

我们喜欢见面，为了和你见面，我会每天做好饭带着饭去见你，见完你在车上坐到很晚才依依不舍回家；

我们总有说不完的话，有时候明明已经聊到了深夜，第二天醒来，还是会迫不及待地告诉你，自己昨天晚上又梦到了什么。

后来，我们住进了同一个家，终于不必再计算见面的时间，不必在分别之后想念对方，也不必为了见上一面，提前安排好一整天的行程。

我们有了共同的钥匙，共同的餐桌，共同的卧室。

每天早晨，他们在同一时间醒来。晚上，我们一起吃饭，一起洗漱，然后一起做一些事情。一切都变得安稳了，安稳得仿佛我们终于得到了曾经想要的一切。

后来，我们开始争吵，吵到最后也没有个结果。虽然那些争吵并没有立刻改变什么，我们依然相爱，依然牵手，我也依然会在和好之后，告诉你以后不会再这样了。有些委屈即使得到了道歉，也不会立刻消失；有些失望没有被认真说出来，也便悄悄留在了心里。

我们只是慢慢学会了，在某些时刻少说一句话，在某些事情上不再坚持，在察觉争吵即将发生的时候，提前收起自己的情绪。

我们都很喜欢回家，可是，不知道从哪一天回家以后，生活似乎总是按照同一种方式发生：晚饭，手机，聊一会天，然后是睡觉。

我们仍然会说话，却很少再像从前那样，一聊就是几个小时。我们仍然会见面很久，却不再总是期待着见面。我们仍然睡在一起，却偶尔会在某个深夜里，感到一种说不清楚的安静。

有一天，你忽然想起了从前，想起了那些不愉快，又想起那些明明已经很晚，却还是舍不得回家的我们；想起那些没有什么特别意义，却让人难忘的下午，你忽然有些难过，自己已经很久没有那样期待过什么了。只留下一句：“我当初就不该和你住一起。”

说不爱了，好像并不是。

毕竟，看到对方生病还是会担心；看到对方疲惫还是会心疼；想到未来，也依然希望那个人在自己的身边。好像仍然拥有着自己最珍惜的人，却渐渐忘记了，应该怎样和这个人一起快乐。

我们每天都在一起。可有时候，我们却不知道，自己究竟应该期待些什么。也许是过去那些不愉快留下了痕迹；也许是生活变得太忙，我们都没有时间再认真经营彼此；也许是因为相处得太久终于习惯了对方的存在，以至于忘记了，曾经那个让自己心动的人，也需要被主动地爱着。

我们也不知道答案。

只是觉得，我们之间，好像少了一点什么。

不是一件具体的东西；不是一束花，不是一场旅行，也不是某一个必须庆祝的纪念日。而是一种感觉：一种明明没有分开，却仍然会期待相见的感觉；一种即使已经熟悉彼此的一切，也依然愿意花时间去了解对方的感觉；一种在平淡的日子里，仍然会突然觉得：

啊，原来在一起生活是一件这么幸福的事情。

那天晚上，我们照常吃完晚饭，窗外的天色渐渐暗了下来，屋子里很安静。我们坐在沙发上，低头看着手机。

“要不要出去散散步？”你问我；

我转头看了你一眼，笑着说：“好啊。”

我们沿着街道慢慢往前走，风吹过路边的树，偶尔有车从身旁经过，我们聊了聊今天发生的事情。

我忽然想起从前：那时候，我们总有说不完的话，明明已经待了很久，却还是舍不得回家，总想着再绕一段路，再多待一会儿…

现在，我们每天都在一起，却好像很久没有这样散过步了。走到路口时，我伸手牵住你，你看了我一眼，什么也没说，只是把我的手握得更紧了一些。

“我们好像很久没出来走走了。”我说。

我们继续往前走。

快到家的时候，你问我：“明天还出来吗？”

“好啊。”

晚上睡觉时，你像往常一样靠进我怀里。我低头看着你，忽然觉得，其实我们并没有走散。

只是日子过得太快，我们忙着生活，忙着处理那些琐碎的小事，偶尔忘了停下来，好好看看彼此。

第二天早上，阳光落在床边，你还没醒，手轻轻搭在我的胳膊上。

我没有起床，只是又往你身边靠了靠，我想，往后的日子大概还是会很平常，我们依然要工作，要吃饭，要面对那些重复的生活。

但没关系。

今晚吃完饭，我们还可以再出去走走，走一条没走过的路，聊一些没聊过的话。

如果走得太晚，就再绕一小段。

就像从前一样。

又不完全一样。

500天快乐！我的宝宝~`;

      let typingTimer = null, charIndex = 0, opened = false, fullShown = false;
      const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, .1, 100);
      camera.position.set(0, 0, 12.6);

      const root = new THREE.Group();
      scene.add(root);

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const pinkLight = new THREE.PointLight(0xff4e87, 24, 18);
      pinkLight.position.set(-3, 3, 4); scene.add(pinkLight);
      const redLight = new THREE.PointLight(0xff183f, 18, 18);
      redLight.position.set(3, -2, -2); scene.add(redLight);

      // 背景微光粒子
      const particleCount = 190, positions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = (Math.random() - .5) * 18;
        positions[i * 3 + 1] = (Math.random() - .5) * 11;
        positions[i * 3 + 2] = (Math.random() - .5) * 5 - 2;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const pMat = new THREE.PointsMaterial({color: 0xff719b, size: .025, transparent: true, opacity: .55});
      const particles = new THREE.Points(pGeo, pMat); scene.add(particles);

      function heartPoint(t, v, scale = 1) {
        // 由心形轮廓向前后两侧收拢，构成圆润、镂空感的完整三维曲面。
        const c = Math.cos(v);
        const x = 16 * Math.pow(Math.sin(t), 3) * c;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * c;
        const z = 5.1 * Math.sin(v);
        return new THREE.Vector3(x / 17 * scale, y / 17 * scale, z / 7.2 * scale);
      }

      const ribbons = [];
      const colors = [0xff426f, 0xff77a5, 0xff3158, 0xff9bb8, 0xf75c87];
      const rowCount = 34;
      const samples = 300;
      const bandWidth = .075;
      // 爱心每一行都使用情书中不同的连续片段，按原文顺序从上到下铺排。
      // 不重复整句；全文仍只在打开信件后完整显示一次。
      const heartSource = sourceText.replace(/[\s；。，“”‘’！？：、…]/g, '　');
      const heartChunkSize = 44;
      function getHeartRowText(rowNo) {
        const start = rowNo * heartChunkSize;
        let chunk = heartSource.slice(start, start + heartChunkSize).trim();
        // 原文若短于所有行的容量，只在末尾补上纪念句，避免出现空行。
        if (!chunk) chunk = '500天快乐！　就像从前一样，又不完全一样。';
        return chunk;
      }

      function makeTextTexture(text, tint, rowNo) {
        const canvas = document.createElement('canvas');
        canvas.width = 4096;
        canvas.height = 160;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';

        const color = '#' + tint.toString(16).padStart(6, '0');
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 5;

        // 将连续空白转换成全角空格
        const clean = text.replace(/\s+/g, '　');
        const chars = Array.from(clean);

        if (chars.length > 0) {
          // 基础字号
          let fontSize = 72;
          ctx.font = `${fontSize}px "Songti SC", "SimSun", "Noto Serif CJK SC", serif`;

          // 测量整行文字
          let widths = chars.map(char => ctx.measureText(char).width);
          let totalWidth = widths.reduce((sum, width) => sum + width, 0);

          // 自动调整字号，避免文字超出纹理
          const targetWidth = canvas.width * 0.96;

          if (totalWidth > 0) {
            fontSize = Math.min(
              108,
              fontSize * targetWidth / totalWidth
            );

            ctx.font = `${fontSize}px "Songti SC", "SimSun", "Noto Serif CJK SC", serif`;
            widths = chars.map(char => ctx.measureText(char).width);
            totalWidth = widths.reduce((sum, width) => sum + width, 0);
          }

          // 汉字水平缩放比例：越小，汉字越窄
          const scaleX = 0.8;

          // 每个字符压缩后的宽度
          const narrowWidths = widths.map(width => width * scaleX);
          const narrowTotal = narrowWidths.reduce(
            (sum, width) => sum + width,
            0
          );

          // 将字符均匀分布在目标宽度内
          const spacing = chars.length > 1
            ? (targetWidth - narrowTotal) / (chars.length - 1)
            : 0;

          let x = (canvas.width - targetWidth) / 2;

          for (let i = 0; i < chars.length; i++) {
            const charWidth = narrowWidths[i];
            const centerX = x + charWidth / 2;

            ctx.save();
            ctx.translate(centerX, canvas.height / 2);
            ctx.scale(scaleX, 1);
            ctx.fillText(chars[i], 0, 0);
            ctx.restore();

            x += charWidth + spacing;
          }
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;

        return tex;
      }

      for (let r = 0; r < rowCount; r++) {
        const v = -1.34 + (2.68 * r / (rowCount - 1));
        const verts = [], uvs = [], indices = [];
        for (let i = 0; i <= samples; i++) {
          const t = (i / samples) * Math.PI * 2;
          const p = heartPoint(t, v, 1);
          const tangent = new THREE.Vector3().subVectors(
            heartPoint(t + .003, v, 1), heartPoint(t - .003, v, 1)
          ).normalize();
          const across = new THREE.Vector3().subVectors(
            heartPoint(t, v + .018, 1), heartPoint(t, v - .018, 1)
          ).normalize().multiplyScalar(bandWidth * .5);
          const a = p.clone().add(across), b = p.clone().sub(across);
          verts.push(a.x, a.y, a.z, b.x, b.y, b.z);
          // A single continuous horizontal text line travels once around each ribbon.
          uvs.push(1 - i / samples, 1, 1 - i / samples, 0); // 修正文字沿曲面反向的问题，让文字朝外可读
          if (i < samples) {
            const k = i * 2;
            indices.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        const tint = colors[r % colors.length];
        const rowText = getHeartRowText(r);
        const tex = makeTextTexture(rowText, tint, r);
        const mat = new THREE.MeshBasicMaterial({map: tex, transparent: true, opacity: .9, side: THREE.DoubleSide, depthWrite: false, blending: THREE.NormalBlending});
        // 景深：按每个文字片段在相机空间中的深度淡化。近处保持清晰，远处逐渐透明。
        mat.onBeforeCompile = (shader) => {
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>', '#include <common>\nvarying float vHeartViewDepth;'
          );
          shader.vertexShader = shader.vertexShader.replace(
            '#include <project_vertex>', '#include <project_vertex>\nvHeartViewDepth = -mvPosition.z;'
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>', '#include <common>\nvarying float vHeartViewDepth;'
          );
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>', '#include <map_fragment>\nfloat heartDepthFade = 1.0 - smoothstep(11.1, 14.0, vHeartViewDepth);\ndiffuseColor.a *= mix(0.42, 1.0, heartDepthFade);'
          );
        };
        mat.customProgramCacheKey = () => 'sara-heart-depth-fade-v2-soft';
        const mesh = new THREE.Mesh(geo, mat);
        const pivot = new THREE.Group();
        pivot.position.set(0, 0, 0);
        pivot.add(mesh);
        root.add(pivot);
        ribbons.push({pivot, mesh, v, phase: r * .42, speed: (r % 2 === 0 ? 1 : -1) * (.07 + (r % 5) * .012), baseY: 0, row: r});
      }

      // Subtle heart outline glimmers
      const outlineMat = new THREE.LineBasicMaterial({color: 0xff719b, transparent: true, opacity: .18});
      for (const v of [-1.35, 1.35]) {
        const pts = [];
        for (let i = 0; i <= 220; i++) pts.push(heartPoint(i / 220 * Math.PI * 2, v, 1.015));
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), outlineMat);
        root.add(line);
      }

      let pointerDown = false, lastX = 0, lastY = 0, moved = false, downAt = 0;
      let rotX = -.06, rotY = .22, targetRotX = rotX, targetRotY = rotY;
      let zoom = 1, targetZoom = 1;
      const pointers = new Map();
      let pinchStart = 0, pinchZoom = 1;
      let isAnimatingOpen = false, openProgress = 0;

      function getPinchDistance() {
        const arr = [...pointers.values()];
        if (arr.length < 2) return 0;
        return Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      }
      renderer.domElement.addEventListener('pointerdown', e => {
        pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
        renderer.domElement.setPointerCapture(e.pointerId);
        if (pointers.size === 1) {pointerDown = true; lastX = e.clientX; lastY = e.clientY; moved = false; downAt = performance.now();}
        if (pointers.size === 2) {pinchStart = getPinchDistance(); pinchZoom = targetZoom; pointerDown = false;}
      });
      renderer.domElement.addEventListener('pointermove', e => {
        if (!pointers.has(e.pointerId)) return;
        const old = pointers.get(e.pointerId); pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
        if (pointers.size >= 2) {
          const d = getPinchDistance();
          if (pinchStart > 0) targetZoom = Math.max(.55, Math.min(8.0, pinchZoom * d / pinchStart));
          return;
        }
        if (pointerDown && !opened) {
          const dx = e.clientX - lastX, dy = e.clientY - lastY;
          if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
          targetRotY += dx * .006;
          targetRotX += dy * .004;
          targetRotX = Math.max(-.9, Math.min(.9, targetRotX));
          lastX = e.clientX; lastY = e.clientY;
        }
      });
      function pointerEnd(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchStart = 0;
        pointerDown = false;
      }
      renderer.domElement.addEventListener('pointerup', pointerEnd);
      renderer.domElement.addEventListener('pointercancel', pointerEnd);
      renderer.domElement.addEventListener('wheel', e => {
        e.preventDefault();
        targetZoom = Math.max(.55, Math.min(8.0, targetZoom * (e.deltaY > 0 ? .92 : 1.087)));
      }, {passive: false});

      let lastTap = 0;
      renderer.domElement.addEventListener('click', e => {
        if (moved || opened || isAnimatingOpen) return;
        const now = performance.now();
        // 点击爱心画布可进入信件；拖动后不触发
        openLetter();
      });

      function startTyping() {
        clearInterval(typingTimer);
        letterText.textContent = '';
        charIndex = 0; fullShown = false;
        typingStatus.textContent = '我们的第5个100天';
        const chars = Array.from(sourceText);
        typingTimer = setInterval(() => {
          if (charIndex >= chars.length) {
            clearInterval(typingTimer);
            typingStatus.textContent = '我们的第5个100天';
            return;
          }
          const ch = chars[charIndex++];
          letterText.textContent += ch;
          if (ch === '\n') {
            // 保持原段落换行
          }
          const delay = ch === '。' || ch === '！' || ch === '？' ? 330 : ch === '，' || ch === '；' ? 170 : ch === '\n' ? 360 : 42;
          clearInterval(typingTimer);
          typingTimer = setTimeout(typeNext, delay);
        }, 1);
        function typeNext() {
          if (fullShown) return;
          if (charIndex >= chars.length) {typingStatus.textContent = '我们的第5个100天'; return;}
          letterText.textContent += chars[charIndex++];
          const ch = chars[charIndex - 1];
          const delay = ch === '。' || ch === '！' || ch === '？' ? 330 : ch === '，' || ch === '；' ? 170 : ch === '\n' ? 360 : 42;
          typingTimer = setTimeout(typeNext, delay);
          const paper = document.querySelector('.letter-paper');
          paper.scrollTop = paper.scrollHeight;
        }
        // replace interval bootstrap with one recursive timer
        clearInterval(typingTimer);
        letterText.textContent = ''; charIndex = 0;
        function tick() {
          if (fullShown) return;
          if (charIndex >= chars.length) {typingStatus.textContent = '我们的第5个100天'; return;}
          const ch = chars[charIndex++];
          letterText.textContent += ch;
          const paper = document.querySelector('.letter-paper');
          paper.scrollTop = paper.scrollHeight;
          const delay = ch === '。' || ch === '！' || ch === '？' ? 330 : ch === '，' || ch === '；' ? 170 : ch === '\n' ? 360 : 42;
          typingTimer = setTimeout(tick, delay);
        }
        typingTimer = setTimeout(tick, 350);
      }

      function openLetter() {
        if (opened || isAnimatingOpen) return;
        opened = true;
        enter.style.opacity = '0';
        veil.classList.add('on');
        // 只显示信件覆盖层，不重置或改变爱心的旋转、缩放和位置。
        letter.classList.add('show');
        back.classList.add('show');
        startTyping();
      }
      function returnToHeart() {
        clearTimeout(typingTimer);
        opened = false; isAnimatingOpen = false; fullShown = true;
        letter.classList.remove('show'); back.classList.remove('show');
        veil.classList.remove('on');
        enter.style.opacity = '1';
        letterText.textContent = '';
      }
      enter.addEventListener('click', openLetter);
      closeLetter.addEventListener('click', returnToHeart);
      back.addEventListener('click', returnToHeart);
      skip.addEventListener('click', () => {
        fullShown = true; clearTimeout(typingTimer);
        letterText.textContent = sourceText;
        typingStatus.textContent = '我们的第5个100天';
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (!opened) {
          root.rotation.x += (targetRotX - root.rotation.x) * .055;
          root.rotation.y += (targetRotY - root.rotation.y) * .055;
          root.scale.setScalar(zoom += (targetZoom - zoom) * .12);
          root.rotation.y += .0015;
          ribbons.forEach((r, i) => {
            r.pivot.rotation.y = Math.sin(t * .45 + r.phase) * .10 + Math.sin(t * .19 + i) * .025;
            r.pivot.rotation.x = Math.sin(t * .34 + r.phase) * .045;
            r.pivot.rotation.z = Math.sin(t * .27 + r.phase) * .035;
            r.mesh.position.z = Math.sin(t * .7 + r.phase) * .018;
          });
        } else {
          root.rotation.y += .001;
        }
        particles.rotation.y = Math.sin(t * .08) * .06;
        particles.rotation.x = Math.cos(t * .07) * .025;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
